<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>room-lab: 部屋の中から見回す試作</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; }
  canvas#view { display: block; }
  .box {
    position: fixed; padding: 12px 14px; background: rgba(10, 12, 20, 0.78);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    color: #e8ecf4; font-size: 12px; line-height: 1.6; backdrop-filter: blur(6px);
  }
  #panel { top: 12px; left: 12px; width: 300px; }
  #panel h1 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
  #panel p.note { opacity: 0.65; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .row label { flex: 0 0 116px; opacity: 0.85; }
  .row input[type="range"], .row select { flex: 1; min-width: 0; }
  .row output { flex: 0 0 44px; text-align: right; opacity: 0.7; font-variant-numeric: tabular-nums; }
  .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  button {
    flex: 1; padding: 6px 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06); color: #e8ecf4; font: inherit; cursor: pointer;
  }
  button.on { background: #2fe8ff; color: #05070d; border-color: #2fe8ff; font-weight: 600; }
  #readout { margin-top: 8px; opacity: 0.8; font-variant-numeric: tabular-nums; white-space: pre-line; }
  #stops { bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; }
  #stops button { flex: none; padding: 6px 10px; }
  #map { bottom: 12px; right: 12px; padding: 6px; }
</style>
</head>
<body>

<canvas id="view"></canvas>

<div id="panel" class="box">
  <h1>room-lab — 部屋の中から見回す</h1>
  <p class="note">
    円形の部屋の中央に立ち、ドラッグで見回す／ホイールか下のボタンで6か所を順に向く。
    見た目は作り込まない（色・形は仮）。確かめるのは魚眼の方式と、部屋の広さと物の大きさの釣り合い。
    キー: ←→ 巡回、1/2/3 ズーム・標準・魚眼。
  </p>
  <div class="modes">
    <button data-mode="zoom">ズーム</button>
    <button data-mode="standard">標準</button>
    <button data-mode="fisheye">魚眼</button>
  </div>
  <div class="row"><label>魚眼の方式</label>
    <select id="fisheyeKind">
      <option value="wide">画角を広げるだけ</option>
      <option value="stereo" selected>樽型（立体射影）</option>
      <option value="equi">樽型（等距離射影）</option>
    </select>
  </div>
  <div class="row"><label>ズームの方式</label>
    <select id="zoomKind">
      <option value="approach" selected>物へ近づく</option>
      <option value="narrow">中央のまま画角を狭める</option>
    </select>
  </div>
  <div class="row"><label>部屋の半径 (m)</label><input id="roomRadius" type="range" min="3" max="8" step="0.1" value="3.3"><output></output></div>
  <div class="row"><label>目の高さ (m)</label><input id="eyeHeight" type="range" min="1.1" max="2.0" step="0.05" value="1.55"><output></output></div>
  <div class="row"><label>標準の水平画角 (°)</label><input id="standardHFov" type="range" min="40" max="110" step="1" value="67"><output></output></div>
  <div class="row"><label>魚眼の水平画角 (°)</label><input id="fisheyeHFov" type="range" min="100" max="220" step="1" value="161"><output></output></div>
  <div class="row"><label>明るさ</label><input id="exposure" type="range" min="0.4" max="3" step="0.05" value="1.75"><output></output></div>
  <div class="row"><label>ラベル</label><input id="labels" type="checkbox" checked></div>
  <div id="readout"></div>
</div>

<div id="stops" class="box"></div>
<div id="map" class="box"><canvas id="minimap" width="220" height="220"></canvas></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const DEG = Math.PI / 180;

// ---- 調整できる値（スライダーと対応） ----
const params = {
  roomRadius: 3.3,
  eyeHeight: 1.55,
  wallHeight: 3.4,
  standardHFov: 67,   // 10/01 ユーザーが試作で選んだ値（今のサイトの縦45°は水平73°）
  fisheyeHFov: 161,
  zoomHFov: 30,
  zoomFill: 0.7,         // 「物へ近づく」ズームで、物の幅が水平画角の何割を占める距離まで寄るか
  fisheyeKind: "stereo",
  zoomKind: "approach",
};
const WIDE_MAX_HFOV = 165; // 通常の遠近（画角を広げるだけ）で許す上限。180°に近づくほど端が無限に伸びる

// ---- 間取り（docs/room-migration.md の「間取り」）。角度は真上から見て時計回り、PC が 0° ----
const ITEMS = [
  { key: "pc",         label: "デスクトップPC（ホーム）",   angle: 0,   stop: true,  focusY: 1.05, frameWidth: 2.1 },
  { key: "about",      label: "ホログラム（自己紹介）",     angle: 22,  stop: true,  focusY: 1.35, frameWidth: 0.9 },
  { key: "products",   label: "展示棚（制作実績）",         angle: 68,  stop: true,  focusY: 1.2,  frameWidth: 1.6 },
  { key: "skills",     label: "技術書の本棚（スキル）",     angle: 112, stop: true,  focusY: 1.35, frameWidth: 1.3 },
  { key: "porthole",   label: "丸窓＋ハンモック",           angle: 165, stop: false, focusY: 1.5 },
  { key: "experience", label: "調査ボード（経歴・活動）",   angle: 218, stop: true,  focusY: 1.55, frameWidth: 2.9 },
  { key: "contact",    label: "通信端末（連絡先）",         angle: 262, stop: true,  focusY: 1.15, frameWidth: 1.1 },
  { key: "door",       label: "扉",                         angle: 290, stop: false, focusY: 1.1 },
  { key: "workbench",  label: "作業台（3Dプリンタ）",       angle: 325, stop: false, focusY: 1.0 },
];
const STOPS = ITEMS.filter((it) => it.stop);
const DESK_CENTER_ANGLE = 8; // 机は PC（0°）からホログラム（22°）までを1枚で受ける

// ---- 描画の土台 ----
const canvas = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.75;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070d);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 60);
camera.rotation.order = "YXZ";

// 樽型の魚眼: 立ち位置から6方向を立方体に描き、画面の各画素を「視線の向き」に写して引く
const cubeTarget = new THREE.WebGLCubeRenderTarget(1024, { type: THREE.HalfFloatType });
const cubeCamera = new THREE.CubeCamera(0.05, 60, cubeTarget);
const fisheyeMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uCube: { value: cubeTarget.texture },
    uRot: { value: new THREE.Matrix3() },
    uHalf: { value: 1 },
    uAspect: { value: 1 },
    uKind: { value: 0 },
  },
  vertexShader: /* glsl */ `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: /* glsl */ `
    varying vec2 vUv;
    uniform samplerCube uCube;
    uniform mat3 uRot;
    uniform float uHalf;
    uniform float uAspect;
    uniform int uKind;
    void main() {
      // 左右の端で r = 1。水平画角の半分 uHalf が r = 1 に来る
      vec2 p = (vUv - 0.5) * 2.0;
      p.y /= uAspect;
      float r = length(p);
      float theta = uKind == 0
        ? 2.0 * atan(r * tan(uHalf * 0.5))  // 立体射影: 局所的な形を保つ（部屋の家具が潰れにくい）
        : r * uHalf;                         // 等距離射影: 中心からの角度が画面上の距離に比例
      vec2 dir2 = r > 1e-6 ? p / r : vec2(0.0);
      vec3 d = vec3(sin(theta) * dir2.x, sin(theta) * dir2.y, -cos(theta));
      gl_FragColor = textureCube(uCube, uRot * d);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
  depthTest: false,
  depthWrite: false,
});
const fisheyeScene = new THREE.Scene();
fisheyeScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fisheyeMaterial));
const fisheyeCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ---- 決定的な乱数（毎回同じ部屋になるように） ----
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---- 部品 ----
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.35, ...extra });
const glow = (color, intensity = 2) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: color, emissiveIntensity: intensity });
function box(w, h, d, material, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  return m;
}
function canvasTexture(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function dirOf(angleDeg) {
  const a = angleDeg * DEG;
  return new THREE.Vector3(Math.sin(a), 0, -Math.cos(a));
}
/** 平らな家具を曲面の壁に背を付けて置く。ローカル +Z（正面）が部屋の中心を向く */
function againstWall(group, angleDeg, width, depth, R) {
  const sag = R - Math.sqrt(Math.max(0, R * R - (width / 2) ** 2));
  const dist = R - sag - depth / 2 - 0.02;
  group.position.copy(dirOf(angleDeg).multiplyScalar(dist));
  group.rotation.y = -angleDeg * DEG;
  return dist;
}

// 壁のパネル線（縦の継ぎ目が多いほど、魚眼の歪み方が読みやすい）
const wallTexture = canvasTexture(1024, 256, (g, w, h) => {
  g.fillStyle = "#2e323a";
  g.fillRect(0, 0, w, h);
  const r = rng(7);
  for (let i = 0; i < 16; i++) {
    const shade = 40 + Math.floor(r() * 14);
    g.fillStyle = `rgb(${shade},${shade + 3},${shade + 8})`;
    g.fillRect(i * 64 + 2, 2, 60, h / 2 - 4);
    g.fillRect(i * 64 + 2, h / 2 + 2, 60, h / 2 - 4);
    g.fillStyle = "rgba(120,60,30,0.35)";
    if (r() < 0.4) g.fillRect(i * 64 + 10 + r() * 30, r() * h, 8 + r() * 20, 6 + r() * 30);
  }
  g.fillStyle = "#15171c";
  for (let i = 0; i <= 16; i++) g.fillRect(i * 64 - 1, 0, 3, h);
  g.fillRect(0, h / 2 - 1, w, 3);
});
wallTexture.wrapS = THREE.RepeatWrapping;
wallTexture.repeat.set(4, 1);

// 床の同心円と放射線（2.png の床の円の模様）
const floorTexture = canvasTexture(1024, 1024, (g, w) => {
  g.fillStyle = "#23262c";
  g.fillRect(0, 0, w, w);
  g.strokeStyle = "#3a3f48";
  g.lineWidth = 4;
  for (const rr of [0.12, 0.26, 0.4, 0.49]) {
    g.beginPath();
    g.arc(w / 2, w / 2, rr * w, 0, Math.PI * 2);
    g.stroke();
  }
  g.strokeStyle = "#2f333b";
  g.lineWidth = 3;
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    g.beginPath();
    g.moveTo(w / 2 + Math.cos(a) * 0.12 * w, w / 2 + Math.sin(a) * 0.12 * w);
    g.lineTo(w / 2 + Math.cos(a) * 0.5 * w, w / 2 + Math.sin(a) * 0.5 * w);
    g.stroke();
  }
});

function screenTexture(kind) {
  return canvasTexture(512, 320, (g, w, h) => {
    if (kind === "gui") {
      g.fillStyle = "#1f5f9e"; g.fillRect(0, 0, w, h);
      g.fillStyle = "#0b1830"; g.fillRect(0, h - 22, w, 22);
      const icons = ["#ffd166", "#ffd166", "#ffd166", "#ffd166", "#ffd166", "#ffd166", "#9ad1ff", "#9ad1ff"];
      icons.forEach((c, i) => { g.fillStyle = c; g.fillRect(16, 14 + i * 34, 24, 20); });
      g.fillStyle = "#e9eef5"; g.fillRect(90, 40, 230, 170);
      g.fillStyle = "#2b6cb0"; g.fillRect(90, 40, 230, 16);
      g.fillStyle = "#f7f9fc"; g.fillRect(250, 110, 220, 150);
      g.fillStyle = "#394b63"; g.fillRect(250, 110, 220, 16);
    } else if (kind === "video") {
      const grd = g.createLinearGradient(0, 0, w, h);
      grd.addColorStop(0, "#ff4fd8"); grd.addColorStop(1, "#2fe8ff");
      g.fillStyle = grd; g.fillRect(0, 0, w, h);
      g.fillStyle = "rgba(0,0,0,0.5)"; g.fillRect(0, h - 26, w, 26);
      g.fillStyle = "#fff"; g.fillRect(12, h - 16, w * 0.4, 5);
    } else {
      g.fillStyle = "#1a1d1a"; g.fillRect(0, 0, w, h);
      const r = rng(3);
      for (let i = 0; i < 3000; i++) { const v = 40 + r() * 60; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(r() * w, r() * h, 2, 2); }
      g.fillStyle = "#6b6f6b"; g.fillRect(200, 120, 70, 140); g.beginPath(); g.arc(235, 100, 32, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#ff3b3b"; g.beginPath(); g.arc(24, 22, 8, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#ffffff"; g.font = "bold 20px sans-serif"; g.fillText("REC  CAM-01", 40, 29);
    }
  });
}

function label(text) {
  const tex = canvasTexture(512, 96, (g, w, h) => {
    g.fillStyle = "rgba(5,7,13,0.72)";
    g.beginPath(); g.roundRect(4, 8, w - 8, h - 16, 18); g.fill();
    g.fillStyle = "#e8ecf4"; g.font = "bold 36px 'Hiragino Kaku Gothic ProN', sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, w / 2, h / 2 + 2);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  s.scale.set(1.3, 0.24, 1);
  s.renderOrder = 10;
  return s;
}

// ---- 部屋を組む（半径を変えたら丸ごと作り直す） ----
let room = null;
const labels = [];
const animated = [];
const itemDist = {}; // 各物の正面が中心からどれだけ離れているか（ズームの立ち位置に使う）

function buildRoom() {
  if (room) {
    scene.remove(room);
    room.traverse((o) => { o.geometry?.dispose(); });
  }
  labels.length = 0;
  animated.length = 0;
  room = new THREE.Group();
  const R = params.roomRadius;
  const H = params.wallHeight;
  const r = rng(11);

  // 床・壁・天井
  const floor = new THREE.Mesh(new THREE.CircleGeometry(R, 96), std(0xffffff, { map: floorTexture, roughness: 0.4, metalness: 0.5 }));
  floor.rotation.x = -Math.PI / 2;
  room.add(floor);
  const wallTex = wallTexture.clone();
  wallTex.repeat.set(Math.max(2, Math.round((2 * Math.PI * R) / 7)), 1);
  wallTex.needsUpdate = true;
  const wall = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 128, 1, true), std(0xffffff, { map: wallTex, side: THREE.BackSide }));
  wall.position.y = H / 2;
  room.add(wall);
  const ceiling = new THREE.Mesh(new THREE.CircleGeometry(R, 96), std(0x1a1c21));
  ceiling.rotation.x = Math.PI / 2;
  ceiling.position.y = H;
  room.add(ceiling);
  for (const [rad, y, t] of [[R - 0.25, H - 0.18, 0.06], [R - 0.45, H - 0.3, 0.04], [R * 0.45, H - 0.12, 0.05]]) {
    const pipe = new THREE.Mesh(new THREE.TorusGeometry(rad, t, 8, 96), std(0x3b3f47));
    pipe.rotation.x = Math.PI / 2;
    pipe.position.y = y;
    room.add(pipe);
  }
  const lamp = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.04, 8, 48), glow(0xffe0b8, 1.5));
  lamp.rotation.x = Math.PI / 2;
  lamp.position.y = H - 0.05;
  room.add(lamp);

  // 机（PC＋ホログラム）
  {
    const g = new THREE.Group();
    const w = 3.0, d = 0.8;
    const dist = againstWall(g, DESK_CENTER_ANGLE, w, d, R);
    const localX = (a) => dist * Math.tan((a - DESK_CENTER_ANGLE) * DEG);
    g.add(box(w, 0.05, d, std(0x55504a), 0, 0.75, 0));
    g.add(box(0.5, 0.72, d - 0.05, std(0x3d4148), -w / 2 + 0.3, 0.36, 0));
    g.add(box(0.5, 0.72, d - 0.05, std(0x3d4148), w / 2 - 0.3, 0.36, 0));
    const pcX = localX(0);
    const screens = [["video", -0.7, 0.35], ["gui", 0, 0], ["cam", 0.7, -0.35]];
    for (const [kind, dx, yaw] of screens) {
      const s = new THREE.Group();
      s.add(box(0.66, 0.42, 0.04, std(0x111318)));
      const face = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.38), new THREE.MeshBasicMaterial({ map: screenTexture(kind), toneMapped: false }));
      face.position.z = 0.021;
      s.add(face);
      s.position.set(pcX + dx, 1.08, -0.15 + Math.abs(dx) * 0.12);
      s.rotation.y = yaw;
      g.add(s);
      g.add(box(0.05, 0.28, 0.05, std(0x222428), pcX + dx, 0.9, -0.17 + Math.abs(dx) * 0.12));
    }
    g.add(box(0.5, 0.02, 0.18, std(0x1c1e22), pcX, 0.785, 0.15)); // キーボード
    // ホログラムのデバイスと、そこから出る光
    const hx = localX(22);
    g.add(box(0.28, 0.08, 0.2, std(0x2a2d33), hx, 0.815, 0));
    g.add(box(0.2, 0.01, 0.12, glow(0x2fe8ff, 3), hx, 0.86, 0));
    const beam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.08, 0.5, 24, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x2fe8ff, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false, toneMapped: false })
    );
    beam.position.set(hx, 1.11, 0);
    g.add(beam);
    const holo = new THREE.Mesh(
      new THREE.IcosahedronGeometry(0.2, 1),
      new THREE.MeshBasicMaterial({ color: 0x7bf3ff, wireframe: true, transparent: true, opacity: 0.85, toneMapped: false })
    );
    holo.position.set(hx, 1.45, 0);
    g.add(holo);
    animated.push((t) => { holo.rotation.y = t * 0.6; holo.position.y = 1.45 + Math.sin(t * 1.3) * 0.03; });
    room.add(g);
    itemDist.pc = dist + d / 2;
    itemDist.about = dist + d / 2;
    const light = new THREE.PointLight(0x5fd8ff, 3, 5, 2);
    light.position.copy(dirOf(10).multiplyScalar(dist - 0.6)).setY(1.4);
    room.add(light);
  }

  // 展示棚（制作実績）
  {
    const g = new THREE.Group();
    const w = 1.6, h = 2.0, d = 0.45;
    const dist = againstWall(g, 68, w, d, R);
    const frame = std(0x3a3d44);
    g.add(box(w, h, 0.03, frame, 0, h / 2, -d / 2));
    g.add(box(0.04, h, d, frame, -w / 2, h / 2, 0));
    g.add(box(0.04, h, d, frame, w / 2, h / 2, 0));
    for (let i = 0; i < 5; i++) {
      const y = 0.05 + i * 0.45;
      g.add(box(w, 0.03, d, frame, 0, y, 0));
      if (i < 4) {
        g.add(box(w - 0.1, 0.015, 0.02, glow(0xffb020, 2.5), 0, y + 0.42, d / 2 - 0.02));
        for (let j = 0; j < 4; j++) {
          const colors = [0x9aa4b2, 0xc9a86a, 0x5aa0c8, 0xb8604a, 0x7fbf7f];
          const m = std(colors[Math.floor(r() * colors.length)], { metalness: 0.6 });
          const kind = Math.floor(r() * 3);
          const geo = kind === 0 ? new THREE.BoxGeometry(0.16, 0.2, 0.16) : kind === 1 ? new THREE.SphereGeometry(0.1, 16, 12) : new THREE.ConeGeometry(0.08, 0.28, 12);
          const gadget = new THREE.Mesh(geo, m);
          gadget.position.set(-w / 2 + 0.25 + j * 0.37, y + 0.14, 0);
          g.add(gadget);
        }
      }
    }
    room.add(g);
    itemDist.products = dist + d / 2;
    const light = new THREE.PointLight(0xffb45a, 2, 3.5, 2);
    light.position.copy(dirOf(68).multiplyScalar(dist - 0.8)).setY(1.2);
    room.add(light);
  }

  // 技術書の本棚（スキル）
  {
    const g = new THREE.Group();
    const w = 1.3, h = 2.5, d = 0.35;
    const dist = againstWall(g, 112, w, d, R);
    const frame = std(0x4a3a2c, { metalness: 0.1 });
    g.add(box(w, h, 0.03, frame, 0, h / 2, -d / 2));
    g.add(box(0.04, h, d, frame, -w / 2, h / 2, 0));
    g.add(box(0.04, h, d, frame, w / 2, h / 2, 0));
    const books = [];
    for (let i = 0; i < 6; i++) {
      const y = 0.04 + i * 0.41;
      g.add(box(w, 0.03, d, frame, 0, y, 0));
      if (i === 5) break;
      let x = -w / 2 + 0.04;
      while (x < w / 2 - 0.08) {
        const bw = 0.03 + r() * 0.035, bh = 0.24 + r() * 0.1;
        books.push({ x: x + bw / 2, y: y + 0.015 + bh / 2, w: bw, h: bh });
        x += bw + 0.004;
      }
    }
    const bookMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), std(0xffffff, { metalness: 0.05, roughness: 0.9 }), books.length);
    const palette = [0x8b2e2e, 0x2e4f8b, 0x2e7a5a, 0xc9a24a, 0x5a4a8b, 0xd0d0c8, 0x333333];
    const m4 = new THREE.Matrix4();
    books.forEach((b, i) => {
      m4.compose(new THREE.Vector3(b.x, b.y, 0), new THREE.Quaternion(), new THREE.Vector3(b.w, b.h, d * 0.8));
      bookMesh.setMatrixAt(i, m4);
      bookMesh.setColorAt(i, new THREE.Color(palette[Math.floor(r() * palette.length)]));
    });
    g.add(bookMesh);
    room.add(g);
    itemDist.skills = dist + d / 2;
  }

  // 丸窓＋ハンモック
  {
    const g = new THREE.Group();
    const dist = R - 0.06;
    g.position.copy(dirOf(165).multiplyScalar(dist));
    g.rotation.y = -165 * DEG;
    const outside = canvasTexture(512, 512, (c, w, h) => {
      const grd = c.createLinearGradient(0, 0, 0, h);
      grd.addColorStop(0, "#0a1030"); grd.addColorStop(1, "#1a0a28");
      c.fillStyle = grd; c.fillRect(0, 0, w, h);
      const rr = rng(21);
      for (let i = 0; i < 40; i++) {
        c.fillStyle = rr() < 0.5 ? "#ff4fd8" : "#2fe8ff";
        c.globalAlpha = 0.4 + rr() * 0.6;
        c.fillRect(rr() * w, rr() * h, 6 + rr() * 30, 2 + rr() * 60);
      }
      c.globalAlpha = 1;
    });
    const glass = new THREE.Mesh(new THREE.CircleGeometry(0.62, 48), new THREE.MeshBasicMaterial({ map: outside, toneMapped: false }));
    glass.position.set(0, 1.85, 0.0);
    g.add(glass);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.66, 0.07, 12, 48), std(0x6a6e76, { metalness: 0.8 }));
    ring.position.set(0, 1.85, 0.03);
    g.add(ring);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-1.0, 1.3, 0.05), new THREE.Vector3(-0.5, 0.92, 0.35),
      new THREE.Vector3(0, 0.82, 0.45), new THREE.Vector3(0.5, 0.92, 0.35), new THREE.Vector3(1.0, 1.3, 0.05),
    ]);
    const hammock = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.16, 10), std(0xb9b09a, { metalness: 0, roughness: 1 }));
    hammock.scale.set(1, 1, 1);
    g.add(hammock);
    room.add(g);
    itemDist.porthole = dist;
    const light = new THREE.PointLight(0xff4fd8, 1.5, 3, 2);
    light.position.copy(dirOf(165).multiplyScalar(dist - 0.6)).setY(1.8);
    room.add(light);
  }

  // 調査ボード（経歴・活動）
  {
    const g = new THREE.Group();
    const w = 2.8, h = 1.5, d = 0.06;
    const dist = againstWall(g, 218, w, d, R);
    const cy = 1.55;
    g.add(box(w + 0.1, h + 0.1, d, std(0x3a2a1c, { metalness: 0 }), 0, cy, 0));
    g.add(box(w, h, d + 0.01, std(0xb08a5a, { metalness: 0, roughness: 1 }), 0, cy, 0.002));
    const pins = [];
    const paperColors = [0xf2ede0, 0xf5e27a, 0xf2a7c3, 0x9fd3f0, 0xdddddd];
    for (let i = 0; i < 20; i++) {
      const pw = 0.18 + r() * 0.2, ph = 0.14 + r() * 0.22;
      const x = -w / 2 + 0.2 + r() * (w - 0.4), y = cy - h / 2 + 0.2 + r() * (h - 0.4);
      const paper = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), std(paperColors[Math.floor(r() * paperColors.length)], { metalness: 0, roughness: 1 }));
      paper.position.set(x, y, d / 2 + 0.01 + i * 0.0005);
      paper.rotation.z = (r() - 0.5) * 0.2;
      g.add(paper);
      pins.push(new THREE.Vector3(x, y + ph / 2 - 0.03, d / 2 + 0.03));
      g.add(box(0.025, 0.025, 0.025, std(0xd02020), x, y + ph / 2 - 0.03, d / 2 + 0.03));
    }
    const lineMat = new THREE.LineBasicMaterial({ color: 0xe02020 });
    for (let i = 0; i < 12; i++) {
      const a = pins[Math.floor(r() * pins.length)], b = pins[Math.floor(r() * pins.length)];
      if (a !== b) g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), lineMat));
    }
    room.add(g);
    itemDist.experience = dist + d / 2;
    const light = new THREE.PointLight(0xffc070, 2.5, 4, 2);
    light.position.copy(dirOf(218).multiplyScalar(dist - 1.0)).setY(2.3);
    room.add(light);
  }

  // 通信端末（連絡先）
  {
    const g = new THREE.Group();
    const w = 1.1, d = 0.6;
    const dist = againstWall(g, 262, w, d, R);
    g.add(box(w, 0.95, d, std(0x3d4148), 0, 0.475, 0));
    const screen = new THREE.Group();
    screen.add(box(0.62, 0.42, 0.05, std(0x1a1c20)));
    screen.add(box(0.56, 0.36, 0.01, glow(0x3fffd0, 2.5), 0, 0, 0.03));
    screen.position.set(0, 1.28, -0.12);
    screen.rotation.x = -0.25;
    g.add(screen);
    g.add(box(0.3, 0.16, 0.25, std(0x55504a), -0.38, 1.03, 0.05));
    g.add(box(0.02, 0.6, 0.02, std(0x888888), 0.45, 1.25, -0.2)); // アンテナ
    g.add(box(0.06, 0.04, 0.01, glow(0xffb020, 3), -0.38, 1.05, 0.18));
    room.add(g);
    itemDist.contact = dist + d / 2;
    const light = new THREE.PointLight(0x3fffd0, 1.5, 3, 2);
    light.position.copy(dirOf(262).multiplyScalar(dist - 0.7)).setY(1.4);
    room.add(light);
  }

  // 扉
  {
    const g = new THREE.Group();
    const w = 1.1, d = 0.1;
    const dist = againstWall(g, 290, w, d, R);
    g.add(box(w + 0.16, 2.26, d, std(0x2a2d33), 0, 1.13, -0.01));
    g.add(box(w, 2.1, d, std(0x5a5e66, { metalness: 0.7 }), 0, 1.07, 0.01));
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.025, 8, 32), std(0x8a8e96, { metalness: 0.8 }));
    wheel.position.set(0, 1.1, d / 2 + 0.04);
    g.add(wheel);
    g.add(box(0.7, 0.04, 0.03, glow(0xffb020, 3), 0, 2.24, d / 2 + 0.02));
    room.add(g);
    itemDist.door = dist + d / 2;
  }

  // 作業台（3Dプリンタ）
  {
    const g = new THREE.Group();
    const w = 1.6, d = 0.7;
    const dist = againstWall(g, 325, w, d, R);
    g.add(box(w, 0.05, d, std(0x6a5a44, { metalness: 0.1 }), 0, 0.9, 0));
    g.add(box(0.06, 0.88, 0.06, std(0x333333), -w / 2 + 0.05, 0.44, d / 2 - 0.05));
    g.add(box(0.06, 0.88, 0.06, std(0x333333), w / 2 - 0.05, 0.44, d / 2 - 0.05));
    g.add(box(0.06, 0.88, 0.06, std(0x333333), -w / 2 + 0.05, 0.44, -d / 2 + 0.05));
    g.add(box(0.06, 0.88, 0.06, std(0x333333), w / 2 - 0.05, 0.44, -d / 2 + 0.05));
    const printer = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.5, 0.55, 0.45)), new THREE.LineBasicMaterial({ color: 0xcfd4dc }));
    printer.position.set(0.35, 1.2, -0.05);
    g.add(printer);
    g.add(box(0.5, 0.04, 0.45, std(0x222428), 0.35, 0.945, -0.05));
    g.add(box(0.08, 0.06, 0.08, glow(0x2fe8ff, 2), 0.35, 1.12, -0.05));
    g.add(box(0.3, 0.12, 0.2, std(0x7a8290), -0.4, 0.985, 0.05));
    room.add(g);
    itemDist.workbench = dist + d / 2;
  }

  // ラベル
  for (const it of ITEMS) {
    const s = label(it.label);
    const d = (itemDist[it.key] ?? R) - 0.7;
    s.position.copy(dirOf(it.angle).multiplyScalar(d)).setY(2.35 + (it.key === "about" ? 0.3 : 0));
    s.visible = document.getElementById("labels").checked;
    labels.push(s);
    room.add(s);
  }

  room.add(new THREE.HemisphereLight(0x8fa8ff, 0x201810, 0.35));
  const centre = new THREE.PointLight(0xffe6c8, 4, 9, 2);
  centre.position.set(0, H - 0.3, 0);
  room.add(centre);

  scene.add(room);
}

// ---- 視点の状態 ----
// yaw: 真上から見て時計回りの角度（PC が 0°）。dist: 中央から yaw の向きへ出ている距離（「物へ近づく」ズームだけが使う）
const view = { yaw: 0, pitch: 0, dist: 0, hfov: params.standardHFov };
let mode = "standard";
let tween = null;

const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const wrap180 = (a) => ((((a + 180) % 360) + 360) % 360) - 180;

function pitchToward(item, yawDist) {
  const horizontal = Math.max(0.3, (itemDist[item.key] ?? params.roomRadius) - yawDist);
  return Math.atan2(item.focusY - params.eyeHeight, horizontal) / DEG;
}
function nearestStopIndex() {
  let best = 0, bestDiff = Infinity;
  STOPS.forEach((s, i) => {
    const diff = Math.abs(wrap180(s.angle - view.yaw));
    if (diff < bestDiff) { bestDiff = diff; best = i; }
  });
  return best;
}
function hfovFor(m) {
  if (m === "standard") return params.standardHFov;
  if (m === "zoom") return params.zoomKind === "narrow" ? params.zoomHFov : params.standardHFov;
  return params.fisheyeKind === "wide" ? Math.min(params.fisheyeHFov, WIDE_MAX_HFOV) : params.fisheyeHFov;
}
function targetFor(m, stop) {
  const hfov = hfovFor(m);
  if (m === "zoom") {
    // 物の幅が水平画角の zoomFill 割を占める距離（今のサイトの frameDistance と同じ考え方）。中央より後ろへは下がらない
    const face = itemDist[stop.key] ?? params.roomRadius;
    const standOff = stop.frameWidth / 2 / params.zoomFill / Math.tan((hfov * DEG) / 2);
    const dist = params.zoomKind === "approach" ? Math.max(0, Math.min(face - 0.4, face - standOff)) : 0;
    return { yaw: stop.angle, pitch: pitchToward(stop, dist), dist, hfov };
  }
  return { yaw: stop ? stop.angle : view.yaw, pitch: stop ? pitchToward(stop, 0) : view.pitch, dist: 0, hfov };
}
function flyTo(target, duration = 0.9) {
  const from = { ...view };
  const to = { ...target, yaw: view.yaw + wrap180(target.yaw - view.yaw) };
  tween = { from, to, t: 0, duration };
}
function setMode(m) {
  mode = m;
  const stop = m === "zoom" ? STOPS[nearestStopIndex()] : null;
  flyTo(targetFor(m, stop), 0.8);
  refreshUi();
}
function goStop(index) {
  const i = (index + STOPS.length) % STOPS.length;
  flyTo(targetFor(mode, STOPS[i]), 0.9);
}
function step(direction) {
  // 今の向きからその方向へ3°より先にある最初の区画
  const ordered = STOPS.map((s, i) => ({ i, diff: wrap180(s.angle - view.yaw) * direction }))
    .filter((o) => o.diff > 3)
    .sort((a, b) => a.diff - b.diff);
  goStop(ordered.length ? ordered[0].i : nearestStopIndex());
}

// ---- 入力 ----
let dragging = null;
canvas.addEventListener("pointerdown", (e) => {
  if (mode === "zoom") return;
  dragging = { x: e.clientX, y: e.clientY };
  tween = null;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const perPx = view.hfov / innerWidth;
  view.yaw -= (e.clientX - dragging.x) * perPx;
  view.pitch = Math.max(-55, Math.min(55, view.pitch + (e.clientY - dragging.y) * perPx));
  dragging = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("pointerup", () => { dragging = null; });
let wheelAcc = 0, wheelLockUntil = 0;
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  if (performance.now() < wheelLockUntil) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) >= 80) {
    step(Math.sign(wheelAcc));
    wheelAcc = 0;
    wheelLockUntil = performance.now() + 450;
  }
}, { passive: false });
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "1") setMode("zoom");
  if (e.key === "2") setMode("standard");
  if (e.key === "3") setMode("fisheye");
});

// ---- UI ----
const stopsBox = document.getElementById("stops");
STOPS.forEach((s, i) => {
  const b = document.createElement("button");
  b.textContent = s.label.replace(/（.*）/, "");
  b.title = s.label;
  b.addEventListener("click", () => goStop(i));
  stopsBox.appendChild(b);
});
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
function bindRange(id, apply) {
  const el = document.getElementById(id);
  const out = el.parentElement.querySelector("output");
  const update = () => { const v = parseFloat(el.value); out.textContent = v.toFixed(el.step < 1 ? 2 : 0); apply(v); };
  el.addEventListener("input", update);
  update();
}
let rebuildTimer = 0;
bindRange("roomRadius", (v) => { params.roomRadius = v; clearTimeout(rebuildTimer); rebuildTimer = setTimeout(() => { buildRoom(); setMode(mode); }, 120); });
bindRange("eyeHeight", (v) => { params.eyeHeight = v; });
bindRange("standardHFov", (v) => { params.standardHFov = v; if (mode === "standard" || (mode === "zoom" && params.zoomKind === "approach")) view.hfov = v; });
bindRange("fisheyeHFov", (v) => { params.fisheyeHFov = v; if (mode === "fisheye") view.hfov = hfovFor("fisheye"); });
bindRange("exposure", (v) => { renderer.toneMappingExposure = v; });
document.getElementById("fisheyeKind").addEventListener("change", (e) => { params.fisheyeKind = e.target.value; if (mode === "fisheye") setMode("fisheye"); });
document.getElementById("zoomKind").addEventListener("change", (e) => { params.zoomKind = e.target.value; if (mode === "zoom") setMode("zoom"); });
document.getElementById("labels").addEventListener("change", (e) => labels.forEach((s) => (s.visible = e.target.checked)));
function refreshUi() {
  document.querySelectorAll("[data-mode]").forEach((b) => b.classList.toggle("on", b.dataset.mode === mode));
}

// ---- 見取り図（真上から。上が PC、時計回り） ----
const map = document.getElementById("minimap").getContext("2d");
function drawMap() {
  const W = 220, c = W / 2, s = (W / 2 - 14) / params.roomRadius;
  map.clearRect(0, 0, W, W);
  map.strokeStyle = "#6a7080"; map.lineWidth = 2;
  map.beginPath(); map.arc(c, c, params.roomRadius * s, 0, Math.PI * 2); map.stroke();
  const facing = STOPS[nearestStopIndex()];
  for (const it of ITEMS) {
    const d = dirOf(it.angle), dd = (itemDist[it.key] ?? params.roomRadius) - 0.25;
    map.fillStyle = it === facing ? "#2fe8ff" : it.stop ? "#e8ecf4" : "#7a8090";
    map.beginPath(); map.arc(c + d.x * dd * s, c + d.z * dd * s, it.stop ? 5 : 3.5, 0, Math.PI * 2); map.fill();
  }
  const cam = dirOf(view.yaw).multiplyScalar(view.dist);
  const px = c + cam.x * s, py = c + cam.z * s;
  const half = Math.min(view.hfov, 359) / 2;
  map.fillStyle = "rgba(47,232,255,0.18)";
  map.beginPath(); map.moveTo(px, py);
  for (let a = -half; a <= half; a += 2) { const d = dirOf(view.yaw + a); map.lineTo(px + d.x * 2.5 * s, py + d.z * 2.5 * s); }
  map.closePath(); map.fill();
  map.fillStyle = "#2fe8ff"; map.beginPath(); map.arc(px, py, 4, 0, Math.PI * 2); map.fill();
}

// ---- 毎フレーム ----
const clock = new THREE.Clock();
const readout = document.getElementById("readout");
const MODE_NAMES = { zoom: "ズーム", standard: "標準", fisheye: "魚眼" };
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / tween.duration);
    const k = easeInOutCubic(tween.t);
    for (const key of ["yaw", "pitch", "dist", "hfov"]) view[key] = tween.from[key] + (tween.to[key] - tween.from[key]) * k;
    if (tween.t >= 1) tween = null;
  }
  animated.forEach((f) => f(t));

  const aspect = innerWidth / innerHeight;
  const pos = dirOf(view.yaw).multiplyScalar(view.dist);
  camera.position.set(pos.x, params.eyeHeight, pos.z);
  camera.rotation.set(view.pitch * DEG, -view.yaw * DEG, 0);
  camera.aspect = aspect;
  const barrel = mode === "fisheye" && params.fisheyeKind !== "wide";
  // 通常の遠近では水平画角をそのまま縦に直す。樽型のときはこのカメラは向きだけを渡す
  camera.fov = barrel ? 90 : (2 * Math.atan(Math.tan((view.hfov * DEG) / 2) / aspect)) / DEG;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();

  if (barrel) {
    cubeCamera.position.copy(camera.position);
    cubeCamera.update(renderer, scene);
    fisheyeMaterial.uniforms.uRot.value.setFromMatrix4(camera.matrixWorld);
    fisheyeMaterial.uniforms.uHalf.value = (view.hfov * DEG) / 2;
    fisheyeMaterial.uniforms.uAspect.value = aspect;
    fisheyeMaterial.uniforms.uKind.value = params.fisheyeKind === "stereo" ? 0 : 1;
    renderer.render(fisheyeScene, fisheyeCamera);
  } else {
    renderer.render(scene, camera);
  }

  const facing = STOPS[nearestStopIndex()];
  const vfov = barrel ? null : 2 * Math.atan(Math.tan((view.hfov * DEG) / 2) / aspect) / DEG;
  readout.textContent =
    `視点: ${MODE_NAMES[mode]}${mode === "fisheye" ? `（${document.getElementById("fisheyeKind").selectedOptions[0].text}）` : ""}\n` +
    `水平画角: ${view.hfov.toFixed(0)}°${vfov ? ` ／ 垂直: ${vfov.toFixed(0)}°` : ""}\n` +
    `向き: ${(((view.yaw % 360) + 360) % 360).toFixed(0)}° ／ 見上げ: ${view.pitch.toFixed(0)}°\n` +
    `正面: ${facing.label}`;
  [...stopsBox.children].forEach((b, i) => b.classList.toggle("on", STOPS[i] === facing));
  drawMap();
  requestAnimationFrame(frame);
}

addEventListener("resize", () => renderer.setSize(innerWidth, innerHeight));

buildRoom();
Object.assign(view, targetFor("standard", STOPS[0]));
refreshUi();
requestAnimationFrame(frame);

// ヘッドレスで撮るときの入口（アニメーションを飛ばして状態を直接置く）
window.__lab = {
  set({ mode: m, fisheyeKind, zoomKind, stop, hfov }) {
    if (fisheyeKind) { params.fisheyeKind = fisheyeKind; document.getElementById("fisheyeKind").value = fisheyeKind; }
    if (zoomKind) { params.zoomKind = zoomKind; document.getElementById("zoomKind").value = zoomKind; }
    if (hfov && m === "fisheye") { params.fisheyeHFov = hfov; }
    mode = m ?? mode;
    Object.assign(view, targetFor(mode, stop === undefined ? (mode === "zoom" ? STOPS[nearestStopIndex()] : null) : STOPS[stop]));
    tween = null;
    refreshUi();
  },
  view, params,
};
</script>
